<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marionette Light</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
  <script src="./vendor/vis-network.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 56" aria-hidden="true" focusable="false">
        <path d="M8 10h32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 6.5v7M32 6.5v7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="24" cy="4.5" r="1.8" fill="currentColor"/>
        <path d="M24 6.5v8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
        <path d="M16 13.5c-4.5 4-6 9-5 13M32 13.5c4.5 4 6 9 5 13" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
        <circle cx="24" cy="30" r="11" fill="#0a0b0e" stroke="currentColor" stroke-width="1.7"/>
        <path d="M18.5 28.5h2.2M27.3 28.5h2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M19.5 35c2 2.4 7 2.4 9 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M24 41v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M15 48c3.5 3.5 14.5 3.5 18 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
      </svg>
      <div>
        <h1>Marionette Light</h1>
        <p class="tag">Control — deploy, admin, sign.</p>
      </div>
    </div>
    <input id="search" spellcheck="false" placeholder="Find plotted address…" />
  </header>

  <main>
    <aside class="panel" id="panel">
      <div class="panel-body">
        <div id="apiBanner" class="api-banner hidden"></div>
        <label>
          Contract addresses
          <textarea id="contracts" spellcheck="false" placeholder="One contract address per line"></textarea>
        </label>
        <label class="chain">
          Chain
          <select id="chainid">
            <option value="1" selected>Ethereum</option>
            <option value="56">BNB</option>
            <option value="137">Polygon</option>
            <option value="42161">Arbitrum</option>
            <option value="8453">Base</option>
            <option value="10">Optimism</option>
          </select>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="includeTestnets" />
          <span>Include testnets</span>
        </label>
        <label>
          Your Etherscan API key
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Stored only in this browser" />
        </label>
        <label class="api-base-label">
          API server
          <input id="apiBaseInput" spellcheck="false" placeholder="https://….onrender.com" />
        </label>
        <div class="panel-actions">
          <button type="button" id="run" class="primary">Expand control tree</button>
          <button type="button" id="scanChains" class="ghost" disabled>Look for plotted addresses on other chains</button>
          <button type="button" id="importJson" class="ghost">Import</button>
          <button type="button" id="exportJson" class="ghost" disabled>Export</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
        <div id="status" class="status idle">Paste contracts → Expand control tree.</div>
        <progress id="bar" max="100" value="0"></progress>
      </div>
      <button type="button" class="rail-toggle" id="togglePanel" title="Toggle left panel" aria-label="Toggle left panel">◀</button>
    </aside>

    <section class="stage">
      <div id="graph" class="graph"></div>
      <div id="empty" class="empty-graph">
        <strong>Control canvas</strong>
        <span>1. Paste contracts · 2. Expand control tree · 3. Select a hand</span>
      </div>
    </section>

    <aside class="inspect" id="inspect">
      <button type="button" class="rail-toggle" id="toggleInspect" title="Toggle right panel" aria-label="Toggle right panel">▶</button>
      <div class="inspect-body">
        <h2>Selection</h2>
        <div id="inspector" class="inspector idle">Click a node.</div>
        <div class="inspect-actions">
          <button type="button" id="expand" class="ghost" disabled>Expand</button>
          <button type="button" id="copyAddr" class="ghost" disabled>Copy</button>
          <a id="openScan" class="ghost linkbtn disabled" href="#" target="_blank" rel="noreferrer">Explorer</a>
        </div>
        <div class="minitabs" id="sideTabs" role="tablist">
          <button type="button" class="minitab on" data-pane="edges" role="tab">Edges</button>
          <button type="button" class="minitab" data-pane="hands" role="tab">Hands</button>
        </div>
        <div id="pane-edges" class="tabpane on">
          <div id="edgeList" class="edgelist"><p class="muted">Nothing selected.</p></div>
        </div>
        <div id="pane-hands" class="tabpane">
          <div class="hands-filters" id="handsChainFilters"></div>
          <table>
            <thead><tr><th>hand</th><th>by chain</th><th></th></tr></thead>
            <tbody id="handsRows"><tr><td colspan="3" class="empty">—</td></tr></tbody>
          </table>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
